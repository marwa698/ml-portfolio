<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Testimonials | Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<div class="admin-body">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 class="admin-page-title">Testimonials</h1>
        <p class="admin-page-sub">Manage client reviews shown in the Testimonials section</p>
      </div>
      <div style="display:flex;gap:12px;align-items:center;">
        <button class="icon-toggle" id="theme-toggle-btn" aria-label="Toggle theme">☀️</button>
        <button class="btn btn-primary" id="add-testimonial-btn">
          <i class="fa-solid fa-plus"></i> Add testimonial
        </button>
      </div>
    </div>

    <div class="admin-table-card">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Client</th>
            <th>Rating</th>
            <th>Quote</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="testimonials-table-body">
          <tr><td colspan="4" class="admin-empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="testimonial-modal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="testimonial-modal-title">Add testimonial</h3>
      <button class="modal-close-btn" id="testimonial-modal-close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="testimonial-form">
      <input type="hidden" id="testimonial-id" />

      <div class="modal-form-row">
        <div class="modal-form-group">
          <label>Client name</label>
          <input type="text" id="testimonial-client-name" class="form-input" placeholder="Dr. Sara Ahmed" required />
        </div>
        <div class="modal-form-group">
          <label>Role / field (optional)</label>
          <input type="text" id="testimonial-role" class="form-input" placeholder="Data & AI" />
        </div>
      </div>

      <div class="modal-form-row">
        <div class="modal-form-group">
          <label>Short tag (optional)</label>
          <input type="text" id="testimonial-tag" class="form-input" placeholder="Detail-Oriented" />
        </div>
        <div class="modal-form-group">
          <label>Rating: <span id="testimonial-rating-display">5</span> / 5</label>
          <input type="range" id="testimonial-rating" min="1" max="5" value="5"
            style="width:100%;accent-color:var(--accent-purple);"
            oninput="document.getElementById('testimonial-rating-display').textContent=this.value" />
        </div>
      </div>

      <div class="modal-form-group">
        <label>Quote / review text</label>
        <textarea id="testimonial-quote" class="form-textarea" placeholder="Marwa is proactive and detail-oriented..." required></textarea>
      </div>

      <div class="modal-form-group">
        <label>Verification link (optional — the platform page where the review was posted)</label>
        <input type="url" id="testimonial-link" class="form-input" placeholder="https://..." />
      </div>

      <div class="modal-form-group">
        <label>Display order</label>
        <input type="number" id="testimonial-order" class="form-input" placeholder="0" value="0" />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="testimonial-cancel-btn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="testimonial-submit-btn">Save testimonial</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/theme-toggle.js"></script>
<script src="../js/api.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-sidebar.js"></script>
<script src="js/admin-toast.js"></script>
<script src="js/manage-testimonials.js"></script>
</body>
</html>
