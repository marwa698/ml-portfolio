<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Platform Links | Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<div class="admin-body">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 class="admin-page-title">Platform Links</h1>
        <p class="admin-page-sub">Freelance platform badges shown in the footer (Fiverr, Upwork, Mostaql, ...)</p>
      </div>
      <div style="display:flex;gap:12px;align-items:center;">
        <button class="icon-toggle" id="theme-toggle-btn" aria-label="Toggle theme">☀️</button>
        <button class="btn btn-primary" id="add-platform-btn">
          <i class="fa-solid fa-plus"></i> Add platform
        </button>
      </div>
    </div>

    <div class="admin-table-card">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Platform</th>
            <th>Profile URL</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="platform-table-body">
          <tr><td colspan="3" class="admin-empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="platform-modal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="platform-modal-title">Add platform</h3>
      <button class="modal-close-btn" id="platform-modal-close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="platform-form">
      <input type="hidden" id="platform-id" />

      <div class="modal-form-group">
        <label>Platform name</label>
        <input type="text" id="platform-name" class="form-input" placeholder="Fiverr" required />
      </div>

      <div class="modal-form-group">
        <label>Profile URL</label>
        <input type="url" id="platform-url" class="form-input" placeholder="https://www.fiverr.com/your-profile" required />
      </div>

      <div class="modal-form-group">
        <label>Logo</label>
        <input type="file" id="platform-logo-input" accept="image/*" />
        <img id="platform-logo-preview" src="" alt="" style="display:none;max-width:100px;max-height:60px;object-fit:contain;margin-top:10px;border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:6px;background:#fff;" onerror="this.style.display='none'" />
      </div>

      <div class="modal-form-group">
        <label>Display order</label>
        <input type="number" id="platform-order" class="form-input" placeholder="0" value="0" />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="platform-cancel-btn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="platform-submit-btn">Save platform</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/theme-toggle.js"></script>
<script src="../js/api.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-sidebar.js"></script>
<script src="js/admin-toast.js"></script>
<script src="js/manage-platform-links.js"></script>
</body>
</html>
